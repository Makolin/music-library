<div class="main">
  <div class="main__title">
    {{'Музыкальная библиотека' | uppercase}}
  </div>

  <!--Ссылка для скачивания правок-->
  <a
      class="main__download"
      download="musical_groups.json"
      matTooltip="Скачать данные"
      [href]="this.dataRequestService.downloadJsonHref"
      (click)="this.createLink()">
    <div class="download">
      <div class="download__image"></div>
    </div>
  </a>
 </div>
