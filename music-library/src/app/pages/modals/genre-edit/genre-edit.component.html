<div class="body">
  <div class="modal">
    <div class="modal-container">
      <app-modal-header
        [titleModal]="this.titleModal"
        [modalType]="this.enumModalType.MusicalGenre">
      </app-modal-header>

      <!--Форма для заполнения-->
      <form
          class="form"
          autocomplete="off"
          [formGroup]="this.form"
          (ngSubmit)="this.editMusicalGenre()">
        <!--Наименование жанра-->
        <mat-form-field>
          <mat-label>Наименование жанра</mat-label>
          <input
            matInput
            formControlName="genre">

          <mat-error *ngIf="this.form.get('groupGenre')?.errors?.['required']">
            Обязательное для заполнения поле
          </mat-error>
          <mat-error *ngIf="this.form.get('groupGenre')?.errors?.['uniqValue']"></mat-error>
        </mat-form-field>

        <!--Кнопки-->
        <div class="form__buttons">
          <button
              mat-raised-button
              class="button"
              (click)="this.closeWindow()">
            Отменить
          </button>
          <button
              mat-raised-button
              class="button"
              [disabled]="this.form.invalid"
              (click)="this.editMusicalGenre()">
            Сохранить
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
