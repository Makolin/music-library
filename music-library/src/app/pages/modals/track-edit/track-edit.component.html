<div class="body">
  <div class="modal">
    <div class="modal-container">
      <app-modal-header
        [titleModal]="this.titleModal"
        [modalType]="this.enumModalType.MusicalTrack">
      </app-modal-header>

      <!--Форма для заполнения-->
      <form
          class="form"
          autocomplete="off"
          [formGroup]="this.form"
          (ngSubmit)="this.editMusicalTrack()">
        <!--Выбор порядкового номера-->
        <mat-form-field>
          <mat-label>Порядковый номер</mat-label>
          <input
            matInput
            maxlength="2"
            minlength="1"
            formControlName="trackSerialNumber">

          <mat-error *ngIf="this.form.get('trackSerialNumber')?.errors?.['required']">
            Обязательное для заполнения поле
          </mat-error>
        </mat-form-field>

        <!--Наименование трека-->
        <mat-form-field>
          <mat-label>Наименование трека</mat-label>
          <input
            matInput
            formControlName="trackName">

          <mat-error *ngIf="this.form.get('trackName')?.errors?.['required']">
            Обязательное для заполнения поле
          </mat-error>
          <!--TODO: Пока не выводится-->
          <mat-error *ngIf="this.form.get('trackName')?.errors?.['uniqValue']"></mat-error>
        </mat-form-field>

        <!--Наименование альбома-->
        <mat-form-field>
          <mat-label>Наименование альбома</mat-label>
          <mat-select
              formControlName="trackAlbumId">
            <mat-option
                *ngFor="let album of this.dataHandlingService.allMusicalAlbums"
                [value]="album.id">
              {{album.groupName}} - {{album.name}}
            </mat-option>
          </mat-select>

          <mat-error *ngIf="this.form.get('trackAlbumId')?.errors?.['required']">
            Обязательное для заполнения поле
          </mat-error>
        </mat-form-field>

        <!--Любимое-->
        <mat-checkbox
            formControlName="trackIsFavorite">
          Трек в любимом
        </mat-checkbox>

        <!--Кнопки-->
        <div class="form__buttons">
          <button
              mat-raised-button
              class="button"
              (click)="this.closeWindow()">
            Отменить
          </button>
          <button
              mat-raised-button
              class="button"
              [disabled]="this.form.invalid"
              (click)="this.editMusicalTrack()">
            Сохранить
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
