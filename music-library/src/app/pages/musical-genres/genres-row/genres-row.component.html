<div class="genre">
  <div
    matTooltip="Редактирование"
    class="genre__edit"
    (click)="this.sendSelectedGenre()">
  </div>

  <div
    matTooltip="Удаление"
    class="genre__delete"
    (click)="this.openDialogDeleteGenre()">
  </div>

  <div class="genre__name">
    {{this.musicalGenre.name}}
  </div>
  <div class="genre__count-group">
    {{this.countGroups}} исполнителей
  </div>
</div>
